{% extends "base.html" %}
{% block title %}Log in — CipherHacks{% endblock %}
{% block content %}
<h1>Welcome back</h1>
{% if err %}<div class="alert" role="alert">{{ err }}</div>{% endif %}
<form class="card" method="post">
<label class="fl" for="username">Handle</label>
<input id="username" name="username" type="text" required autocomplete="username">
<button class="btn primary" type="submit">Log in</button>
</form>
{% endblock %}
