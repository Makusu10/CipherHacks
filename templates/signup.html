{% extends "base.html" %}
{% block title %}Sign up — CipherHacks{% endblock %}
{% block content %}
<h1>Pick a handle</h1>
<p class="muted">We store only your handle plus progress. No email needed, no newsletter, no tracking. Read <a href="/privacy">Privacy</a> first.</p>
{% if err %}<div class="alert" role="alert">{{ err }}</div>{% endif %}
<form class="card" method="post">
<label class="fl" for="username">Handle (3–24 chars)</label>
<input id="username" name="username" type="text" required minlength="3" maxlength="24" autocomplete="username" placeholder="quiet_packet">
<p><label><input type="checkbox" name="consent" value="yes" required> I agree to store my handle and lesson progress so the skill tree works. I know I can delete it anytime under Profile.</label></p>
<button class="btn primary" type="submit">Create account</button>
</form>
{% endblock %}
